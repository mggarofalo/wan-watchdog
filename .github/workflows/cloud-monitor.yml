name: cloud monitor

on:
  push:
    branches: [main]
    paths: ['cloud-monitor/**', '.github/workflows/cloud-monitor.yml']
  pull_request:
    branches: [main]
    paths: ['cloud-monitor/**', '.github/workflows/cloud-monitor.yml']
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: cloud-monitor
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: cloud-monitor/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:runtime
