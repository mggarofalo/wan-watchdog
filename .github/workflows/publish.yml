name: publish

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Byte-compile everything
        run: python -m compileall -q .

      # --offline skips the probes that need outbound internet, so the run is
      # deterministic. The decision logic and the gateway HTML parsing are the
      # parts worth gating a release on, and both run offline.
      - name: Self-test
        run: python selftest.py --offline

  build:
    name: build and push
    needs: test
    runs-on: ubuntu-latest
    permissions:
      # The repository default is read-only, so the write scope has to be
      # granted explicitly here.
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # QEMU is what makes the arm64 half of the manifest possible, so the
      # same image runs on the Raspberry Pi as on the mini PC.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          # Pull requests build to verify the Dockerfile but publish nothing.
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        if: github.event_name != 'pull_request'
        run: |
          # Confirm the entrypoint runs and refuses to start without config,
          # rather than crashing for some unrelated reason.
          set -e
          out=$(docker run --rm --pull=always \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-$(git rev-parse --short HEAD) \
            --once 2>&1 || true)
          echo "$out"
          echo "$out" | grep -q "WATCHDOG_EXTERNAL_URL is required"
