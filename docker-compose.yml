name: wan-watchdog

# Self-contained: every setting is a literal in this file. No .env, no shell
# interpolation. Copy it to the host you are deploying on and edit the values
# marked CHANGE ME.
#
# Note that this means BGW_ACCESS_CODE lives in this file. That is fine for a
# deployed copy on your own machine; just do not commit a filled-in copy to a
# public repository. The version in git carries a placeholder.

services:
  wan-watchdog:
    image: ghcr.io/mggarofalo/wan-watchdog:stable
    container_name: wan-watchdog
    restart: unless-stopped

    # The reverse proxy publishes this as https://health.<your-domain>/ and the
    # watchdog then calls that public URL, so the request leaves the network and
    # comes back in. Left side is the host port nginx should proxy to.
    ports:
      - "3000:8080"

    environment:
      TZ: Etc/UTC

      # ---- gateway --------------------------------------------------------
      # Factory default. Check the second hop of a traceroute if the gateway's
      # LAN subnet was moved to make room for a downstream router.
      BGW_GATEWAY_HOST: CHANGE_ME
      # Printed on the label on the side of the gateway.
      BGW_ACCESS_CODE: "CHANGE_ME"

      # ---- the round trip --------------------------------------------------
      # The probe that matters: out to Cloudflare, back in through the gateway
      # and the reverse proxy, to this container's own health endpoint.
      WATCHDOG_EXTERNAL_URL: https://health.CHANGE_ME.com/healthz

      # The local reverse proxy, checked with the same Host header nginx routes
      # on. Without this an nginx outage is indistinguishable from a gateway
      # fault -- and nginx holds the TLS certificate, so it takes the external
      # probe down with it every time it restarts.
      WATCHDOG_PROXY_URL: http://CHANGE_ME_HOST_IP/healthz
      WATCHDOG_PROXY_HOST: health.CHANGE_ME.com

      # Proves the WAN is up, to tell "inbound broken" from "whole line down".
      WATCHDOG_OUTBOUND_URL: https://1.1.1.1/cdn-cgi/trace

      # ---- tuning ----------------------------------------------------------
      WATCHDOG_PORT: 8080
      WATCHDOG_CHECK_INTERVAL: 60
      WATCHDOG_PROBE_TIMEOUT: 20
      # Five consecutive failures of the SAME kind, so about five minutes.
      WATCHDOG_FAILURES_BEFORE_REBOOT: 5
      # Never reboot more than once per six hours.
      WATCHDOG_MIN_SECONDS_BETWEEN_REBOOTS: 21600
      # Time for the gateway to boot and renegotiate the line.
      WATCHDOG_POST_REBOOT_GRACE: 420
      # 0 = off. Set to e.g. 3 for an unconditional reboot every three days in
      # addition to the fault-driven logic.
      WATCHDOG_SCHEDULED_REBOOT_DAYS: 0
      WATCHDOG_STARTUP_DELAY: 15
      WATCHDOG_STATE_FILE: /data/state.json
      WATCHDOG_VERIFY_INSTANCE: "true"

      # Start here. Logs the reboot decision without sending it, so you can
      # confirm it fires when the fault appears and never otherwise. Set to
      # "false" once you have watched it through at least one real episode.
      WATCHDOG_DRY_RUN: "true"

      # Optional: any endpoint accepting a plain-text POST, e.g. an ntfy topic.
      WATCHDOG_NOTIFY_URL: ""
      WATCHDOG_NOTIFY_TOKEN: ""

      # Optional: enables /status with richer detail. Empty keeps it returning
      # 404, which matters because the endpoint is reachable from the public
      # internet through the same reverse proxy as /healthz.
      WATCHDOG_STATUS_TOKEN: ""

    volumes:
      # Reboot history and the rate-limit clock, so a container restart cannot
      # reset the "at most once per six hours" guard.
      - ./data:/data

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
